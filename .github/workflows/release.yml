name: Windows release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build portable application
        run: python -m PyInstaller --noconfirm GWR-Desktop.spec
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/GWR-Fast-Watermark-Remover/*' -DestinationPath 'GWR-Fast-Watermark-Remover-windows.zip' -Force
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} GWR-Fast-Watermark-Remover-windows.zip --generate-notes --title "GWR Fast Watermark Remover ${{ github.ref_name }}"
