name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax check
        run: python -m compileall -q main.py worker.py
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: ruff check main.py worker.py tests

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Package
        run: python -m PyInstaller --noconfirm GWR-Desktop.spec
      - uses: actions/upload-artifact@v4
        with:
          name: GWR-Fast-Watermark-Remover-windows
          path: dist/GWR-Fast-Watermark-Remover
